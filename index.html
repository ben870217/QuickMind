<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0ea" />
    <meta name="description" content="在本機整理想法的 QuickMind 心智圖工具" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      (() => {
        const key = 'quickmind.theme';
        let preference = 'system';
        try {
          const stored = localStorage.getItem(key);
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            preference = stored;
          }
        } catch {
          // The application will still apply the session theme after startup.
        }
        const systemIsDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        const theme = preference === 'system' ? (systemIsDark ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#252322' : '#f4f0ea');
      })();
    </script>
    <title>QuickMind</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
